
# Standard profile
[standard]
pacstrap.include = [
    "main",
    "devel",
    "zsh",
    "bash",
    "pipewire",
    "nvidia",
]
pacman.include = [
    "main"
]
aur.include = [
    "main"
]

# KDE standard
[kde-standard]
base = "standard"

# GNOME standard
[gnome-standard]
base = "standard"

# Minimal profile
[minimal]
pacstrap.include = []

# nvidia-580xx sub-profile
[nvidia-580xx]
base = "standard"
pacstrap.exclude = [
    "nvidia"
]
aur.include = [
    "nvidia-580xx"
]